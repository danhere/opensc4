# Address database: SimCity 4 Deluxe 1.1.641 for Windows (Steam, GOG and EA
# share this build). Virtual addresses, image base 0x400000.
#
# One entry per address that OpenSC4 code or tooling relies on. src/core gets
# these as constants from the generated addresses.h (tools/gen_addresses.py);
# core.dll checks each `expect` against memory at startup and logs mismatches,
# which reveal a different build or another DLL patching that address.
#
# Fields:
#   name        C++-style name; becomes opensc4::addr::<name with :: -> _>
#   address     virtual address
#   kind        "function" (hookable at its entry), "vtable" or "data"
#   convention  cdecl | stdcall | thiscall | fastcall | custom (functions only)
#   signature   C++ prototype, `this` first for thiscall
#   expect      first bytes at the address, hex, to verify the build
#   source      how the address was identified; link the evidence
#
# Never record mid-function addresses as "function": hooks go at entries only
# (docs/architecture.md, "Hooking layer").

[[entry]]
name = "BuildSentinel"
address = 0x006E5000
kind = "data"
expect = "0F"
source = "Ecosystem DLLs' build-641 check (docs/patch-census.md, section 1). The byte is the first opcode byte of an instruction, not data."

