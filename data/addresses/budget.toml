# The budget simulator (cSC4BudgetSimulator), its departments and line items (docs/budget.md).

[[entry]]
name = "cSC4BudgetSimulator::vftable"
address = 0x00AB0908
kind = "vtable"
expect = "80 FC 68 00 A0 7B 4F 00"
source = "Primary vtable: cISC4BudgetSimulator, 59 slots in gzcom-dll's order and the scalar deleting destructor (slot 59), then slot 60 (0x0068FD00, the class ID). simulators.budget.* swap its slots (docs/budget.md)."

