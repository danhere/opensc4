[[entry]]
name = "GZRaster32::FillSpans"
address = 0x00854E10
kind = "function"
convention = "thiscall"
signature = "void (void* this, const uint32_t* spans, int32_t count, const uint32_t* target, uint32_t colour)"
expect = "53 8B 5C 24 0C 55 8B 6C"
source = "Name ours (docs/renderer.md, \"The software rasterizer\"). Span renderer slot 1. Spans are pairs of (y << 16 | x) start and end; each is filled with the colour, 4 bytes a pixel, at target[0] + target[1] * y + 4x (REP STOSD through 0x00910003). One of the four spans that ran. Ours in renderer.raster.spans."

