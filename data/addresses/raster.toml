# The GZ framework's software rasterizer, 0x0082B780 to 0x00864B5F (docs/uncharted-code.md, "Block 1"; docs/renderer.md, "The software rasterizer"). A drawing context (vtable 0x00AC16C8) keeps a state stack and hands every draw to a rasterizer (vtable 0x00AC17D0), which owns five span renderers, one per pixel format; only the 32-bit one runs. Ours in src/core/raster_spans.cpp, group renderer.raster.spans.

[[entry]]
name = "GZDrawContext::vftable"
address = 0x00AC16C8
kind = "vtable"
expect = "90 BE 82 00 80 BE 82 00"
source = "Name ours (docs/renderer.md, \"The software rasterizer\"). 48 slots; 0 QueryInterface 0x0082BE90 (1 and 0x2AE63219, the drawing context interface), 1 AddRef 0x0082BE80, 2 Release 0x0082CF10; 17 SetTarget 0x0082C830 (makes the rasterizer through the framework: class 0xEB2EA3CB, interface 0x4B2EA3B3), 38 Blt 0x0082C530 and 39 TiledBlt 0x0082C620. Made 200 bytes by 0x0082C9A0."

