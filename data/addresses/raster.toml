# The GZ framework's software rasterizer, 0x0082B780 to 0x00864B5F (docs/uncharted-code.md, "Block 1"; docs/renderer.md, "The software rasterizer"). A drawing context (vtable 0x00AC16C8) keeps a state stack and hands every draw to a rasterizer (vtable 0x00AC17D0), which owns five span renderers, one per pixel format; only the 32-bit one runs. Ours in src/core/raster_spans.cpp (group renderer.raster.spans), src/core/raster_context.cpp (renderer.raster.context, renderer.raster.draws and renderer.raster.target) and src/core/raster_rasterizer.cpp (renderer.raster.rasterizer).

