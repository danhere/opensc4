# cSTETerrain (build 641), piece 5: erosion, the flood, the water distance map (src/core/terrain_erode.cpp).
# New names only; cSTETerrain::Erode, ::FloodStep and ::UpdateWaterDistances (terrainsim4.toml) are reused and
# are ours in simulators.terrain.erode, cSTETerrain::PrepareRect (terrainsim4.toml) in simulators.terrain.erode_normals
# (src/core/terrain_erode_2.cpp).

[[entry]]
name = "cSTETerrain::ErodePass"
address = 0x00746AD0
kind = "function"
convention = "thiscall"
signature = "void (cSTETerrain* this, const int32_t* rect, int32_t iterations)"
expect = "83 EC 30 56 8B F1 D9 46"
source = "Name ours. Hydraulic erosion over a rectangle of vertices: the water line is the sea level less 0x00AB3CC8; depths set to line - altitude below it and 0 above, sediment 0; then per iteration rain (0x00B0D5A8 x the altitude, above the line) and the flow of each wet vertex to the neighbour 0x00744760 names (none on the rectangle's border), carrying and depositing sediment and eroding unlocked vertices; at the end the water object resets the rectangle grown by one (0x0073D180). Called by 0x00747B20 and by the brushes' erosion layer (0x00747A20). Ours in simulators.terrain.erode (src/core/terrain_erode.cpp)."

[[entry]]
name = "cSTETerrain::SmoothAll"
address = 0x00746F40
kind = "function"
convention = "thiscall"
signature = "void (cSTETerrain* this, int32_t passes)"
expect = "51 8B 44 24 08 85 C0 0F"
source = "Name ours. `passes` times over every vertex: against each neighbour inside the grid (the +0x84 table's order), the excess of the altitude difference over the limit (0x00B4BCF4 straight, 0x00B4BCF0 diagonal) times 0x00B4B40C is taken from the higher and added to the lower, unless locked; clamps 0x00B0D5E0 and 0x00B0D5DC; water depth = sea level - altitude. Only 0x00747B20 calls it. Ours in simulators.terrain.erode (src/core/terrain_erode.cpp)."

