[[entry]]
name = "SC4DistanceRows::Spread"
address = 0x005E5180
kind = "function"
convention = "cdecl"
signature = "uint8_t (void* rows, uint8_t first, uint8_t steps)"
expect = "51 53 8B 5C 24 0C 8B 0B"
source = "Name ours. On a vector of byte rows (12-byte vectors): for value = first, first + 1, ... (at most `steps` of them) every cell holding the value lowers its four straight neighbours (clamped to the grid) to value + 1 when they hold more (0x005E4C50, which takes the rows in EBX); stops at a value that changed nothing. Only the bytes of the two numbers are read. Only 0x007440C0 calls it (0x00744210). The game's; called at its address."

