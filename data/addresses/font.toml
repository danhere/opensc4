[[entry]]
name = "GZFontSystem::GetFont"
address = 0x00894ADF
kind = "function"
convention = "thiscall"
signature = "void* (void* this, void* face_name, uint32_t unknown, uint32_t size, uint32_t style, bool reuse)"
expect = "55 8B EC 81 EC E0 02 00"
source = "Name ours. Slot 11 (+0x2C) of 0x00AC5488; `ret 0x14`; the second argument is a kind, compared with a face's +0x40 when the list is empty. Splits the face list (in lower case) at commas, renames a name without a face to the alias that lists it, scores every face by name and style bits, and either returns a matching font already made (reuse, AddRef'd) or makes one with its own slot 10 (0x00895A1C). ui.toml's SC4::Singleton913D22 is the usual way in. Ours in framework.font.system.getfont (docs/fonts.md, f2a)."

