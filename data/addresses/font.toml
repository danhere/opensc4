[[entry]]
name = "GZFont::RenderGlyph"
address = 0x00898FDC
kind = "function"
convention = "thiscall"
signature = "void* (void* this, uint32_t character, void* sheet)"
expect = "55 8B EC 83 EC 4C 53 8B"
source = "Name ours, not hooked. Slot 61 (+0xF4); `ret 8`. Maps the character to a glyph (cmap 0x0089F4B2, or the `uniXXXX` name 0x00898EB2 for type 1 and 0x16 faces, else the fallback), renders it with T2K (0x0089F23B, monochrome or 8-bit grey by the mode at +0x4C), stores the bitmap and metrics in the glyph sheet (slot 62) and caches the entry. Characters without a glyph get a box (docs/fonts.md, f3)."

