# The framework's fonts: the font system, the font class and its glyph blitter (docs/fonts.md). Nothing here is hooked yet.

[[entry]]
name = "GZFontDirector::Construct"
address = 0x00895F7B
kind = "function"
convention = "thiscall"
signature = "void* (void* this)"
expect = "56 8B F1 E8 0A 82 07 00"
source = "Name ours, not hooked. The fonts' COM director (vtables 0x00AC5548 and 0x00AC5518), made once by its static getter 0x00896012 (called from 0x004600EE). Registers class 0x20673960 (font system, factory 0x00895F36), 0x1AA404AC (font, 0x00895F4C) and 0x08CDA30B (glyph blitter, 0x00895F65). Its slot 4 (0x00895FCD) makes the font system with interface 0x287FB697 and gives it to the framework as a system service (docs/fonts.md, f1)."

[[entry]]
name = "GZFontSystem::Construct"
address = 0x00895268
kind = "function"
convention = "thiscall"
signature = "void* (void* this)"
expect = "55 8B EC 83 EC 14 53 33"
source = "Name ours, not hooked. Class 0x20673960, 0x70 bytes, vtables 0x00AC5488 (main) and 0x00AC5454 (+4). Sets up the face and alias maps and the file patterns `*.tt?`, `*.pfb`, `*.mxf`, `*.otf` that its scans use (the game's Fonts folder and the Windows one; slot 15 lists the folders, slot 14 opens each file). No arguments, plain ret (docs/fonts.md, f2)."

[[entry]]
name = "GZFontSystem::GetFont"
address = 0x00894ADF
kind = "function"
convention = "thiscall"
signature = "void* (void* this, void* face_name, uint32_t unknown, uint32_t size, uint32_t style, bool reuse)"
expect = "55 8B EC 81 EC E0 02 00"
source = "Name ours, not hooked. Slot 11 (+0x2C) of 0x00AC5488; `ret 0x14`. Splits the face list at commas, scores every face by name and style bits, and either returns a matching font already made (reuse, AddRef'd) or makes one with its own slot 10 (0x00895A1C). ui.toml's SC4::Singleton913D22 is the usual way in (docs/fonts.md, f2)."

