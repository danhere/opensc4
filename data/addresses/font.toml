[[entry]]
name = "GZFont::DrawString"
address = 0x0089A099
kind = "function"
convention = "thiscall"
signature = "bool (void* this, void* picture, int32_t x, int32_t y, const void* text, uint32_t length, uint32_t colour, uint32_t colour2, const int32_t* clip, int32_t* pen)"
expect = "55 8B EC 83 EC 2C 53 56"
source = "Name ours, not hooked. Slot 51 (+0xCC); `ret 0x24`. One line of text into a picture: the text converted to UTF-16 (0x00899BCA, with Thai composition 0x00899665), each glyph fetched from the cache (slot 60), placed from the pen (x, y, or *pen) and clipped to clip (left, top, right, bottom) if given, then the list handed to the blitter at +0x8C (its slot 7) between its begin and end (slots 5 and 6, the picture's lock 0x8080). Colour 0x08000000 means the font's own (+0x44). *pen gets the end position. Every text draw passes here; ran in all 17 coverage runs (docs/fonts.md, \"Crisp text hook points\")."

