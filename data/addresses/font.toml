# The framework's fonts: the font system, the font class and its glyph blitter (docs/fonts.md). Ours: the glyph blitter (GZFontBlitter, f4) in framework.font.blitter.draw and framework.font.blitter.object; the director (GZFontDirector, f1) in framework.font.director; the T2K holder and its stream (GZFontFile, GZFontStream, f5) in framework.font.t2k.stream, .holder and .names; the font system (GZFontSystem, f2a) in framework.font.system.object, .faces, .aliases and .getfont. The font system's STLport tables (f2b) in framework.font.system.tables and .shared (four of the shared ones are named in gzui.toml). The font's object, properties and blitter (GZFont, f3a) in framework.font.font.object, .properties and .blitter; its containers (f3b) in framework.font.font.containers and .shared; its loading, size and scale (f3c) in framework.font.font.load; the rest of the font is not hooked yet.

