[[entry]]
name = "cSC4ResidentialSimulator::CopyGrid"
address = 0x006F8970
kind = "function"
convention = "cdecl"
signature = "void (cISC4SimGrid<uint8_t>* to, cISC4SimGrid<uint8_t>* from, void (*store)(uint8_t* cell, uint32_t value, uint32_t argument), uint32_t argument)"
expect = "83 EC 28 53 55 56 8B 74"
source = "Name ours. Copies one byte grid into another of another resolution (slots 11-13 and 24/25): same shift cell by cell, finer source cells averaged, coarser ones repeated, each through `store`. Also called from 0x0068F63F. Ours in simulators.residential.messages (docs/residential.md)."

