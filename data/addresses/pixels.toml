[[entry]]
name = "UIPictureTextures::Create"
address = 0x00991440
kind = "function"
convention = "thiscall"
signature = "bool (void* this, uint32_t argument)"
expect = "83 EC 18 53 56 8B F1 8B"
source = "Name ours (docs/ui-scaling.md, \"Sharp interface tiles\"). Primary vtable slot 9 (0x00ADB2E0 + 0x24), `ret 4`: splits the CPU-drawn picture at +0x10 into tiles of 16 to 256 pixels (0x00A6CF00) and creates one texture each through the graphics driver (its slot 0xF0, format by the picture's type); the tiles' textures go in the vector at +0x14. Called by Upload 0x00990FF0 when it has none. Wrapped in renderer.interface.sharp_tiles."

[[entry]]
name = "UIPictureTextures::Upload"
address = 0x00990FF0
kind = "function"
convention = "thiscall"
signature = "bool (void* this, uint32_t argument)"
expect = "83 EC 40 8B 44 24 44 53"
source = "Name ours (docs/ui-scaling.md, \"Sharp interface tiles\"). Secondary vtable slot 0 (0x00ADB308), `ret 4`: the picture's changed pieces sent to its tiles' textures (the graphics driver's slot 0xF4, LoadTextureLevel): Create first when there are no tiles; straight from the picture's memory, or through the colour-key copies 0x008D0820/0x008D0860/0x008D08A0 into a block when the picture has a colour key (its slot 0x60), the whole tile then. Each tile's pieces come from 0x00A6CD10 on +0x24: the picture's x and y, the tile's x and y, the size. Noted by renderer.interface.sharp_text."
