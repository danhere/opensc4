# The GZ framework's vertex format and pixel helpers, 0x008D01F0 to 0x008D2993 (docs/pixels.md): leaf functions the stock drivers, UIPictureTextures::Upload and game code call. Ours in src/core/pixels.cpp, groups renderer.pixels.*.

[[entry]]
name = "GDVertexFormat::Expand"
address = 0x008D01F0
kind = "function"
convention = "cdecl"
signature = "uint32_t (uint32_t format)"
expect = "8B 44 24 04 85 C0 78 5E"
source = "Name ours (docs/pixels.md, \"Vertex formats\"). A legacy format ID (1, 2, 3, 10, 11, 0x20 to 0x26) to its bit field; a bit field (bit 31) back as it is; 0 for any other. Keeps ECX and EDX, which 0x008D04A0 and 0x008D0520 rely on. Ours in renderer.pixels.vertex."

[[entry]]
name = "GDVertexFormat::Make"
address = 0x008D02C0
kind = "function"
convention = "cdecl"
signature = "uint32_t (uint32_t count, const int32_t* types)"
expect = "83 EC 28 8B 54 24 2C 33"
source = "Name ours (docs/pixels.md, \"Vertex formats\"). Counts the element types (0 to 9) of the list and packs the counts, unmasked, at the bit positions of the table 0x00ACC0D4, with bit 31. Ours in renderer.pixels.vertex."

