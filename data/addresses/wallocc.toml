[[entry]]
name = "cSC4LotRetainingWallOccupant::ComputeEdgeHashes"
address = 0x005E2CE0
kind = "function"
convention = "cdecl"
signature = "bool (cISC4Lot* lot, float altitude, const int32_t* cells, uint32_t* hashes, float* highest)"
expect = "83 EC 38 D9 44 24 40 8B"
source = "Name ours. *highest = altitude + 0.1 (0x00A8C950); then per side 0 to 3 (mask 1 << side): the neighbour cells along it (lot manager slot 12); a side gets a wall when one of them has no lot or a lot without flag 1; its hash is a bit per neighbour cell with a lot whose state is not 6 (from 0x80000000 down, wrapping), plus for every vertex along the side (lot manager slot 11; terrain slot 14) (bits of float(height + 12582912.0) + 0xB4C00000) * z * x + 1, the highest vertex raising *highest. True when a vertex was visited. The lot itself is not used. Called at 0x005E30CB and 0x005E38AA (the lot's wall update 0x005E37F0; nothing read from the registers after). Ours in simulators.wallocc.helpers."

