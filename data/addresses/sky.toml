# The water effects, sky and clouds layer of the renderer (docs/renderer.md).

[[entry]]
name = "cSC43DRender::AddViewObject"
address = 0x007C5D90
kind = "function"
convention = "thiscall"
signature = "bool (cSC43DRender* this, cISC4ViewObject3D* object, int32_t pass, uint32_t order)"
expect = "8B 44 24 08 83 F8 03 56"
source = "Vtable 0x00ABAB60 slot 32 (gzcom-dll cISC43DRender.h). Adds the object to one of four lists by pass: 3 (+0x188), 5 (+0x18C), 0 (+0x190), 2 (+0x194); cSC43DRender::Draw calls each list's objects (slot 0xC, with the render context) around the static and moving passes."

