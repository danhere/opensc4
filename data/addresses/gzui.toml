[[entry]]
name = "cGZPropSetBinaryIO::Read"
address = 0x009409E0
kind = "function"
convention = "thiscall"
signature = "bool (void* this, void* stream, void* set)"
expect = "55 8B EC 83 EC 4C 56 8B"
source = "Name ours. Slot 3; `ret 8`. The record type (0x2BEA4862, else false), the version (a word kept at +8, at most 1), the count, then for each value its type and key and data (uint32, bool, float, string; another type is skipped with nothing read), each put in the set by SetProperty. False as soon as a read fails. Ours in framework.propio.binary (docs/gzui.md, part u2)."

[[entry]]
name = "cGZPropSetBinaryIO::Write"
address = 0x0094017F
kind = "function"
convention = "thiscall"
signature = "bool (void* this, void* stream, void* set, uint32_t unused)"
expect = "55 8B EC 51 57 8B 7D 0C"
source = "Name ours. Slot 4; `ret 0xC`. Nothing for an empty set (false); else 0x2BEA4862, the version 1 (a word), the count, and per value its type, key and data in GetFirst/GetNext order. A sint32 value, or a failed write, stops it with false part way. The float goes through the FPU (FLD/FSTP). Ours in framework.propio.binary (docs/gzui.md, part u2)."

