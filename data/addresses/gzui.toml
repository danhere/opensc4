# The GZ framework's property sets and their values (src/core/gzui_propset.cpp, docs/gzui.md).

[[entry]]
name = "cGZPropertySet::Construct"
address = 0x00939237
kind = "function"
convention = "thiscall"
signature = "void* (void* this)"
expect = "56 8B F1 83 66 04 00 8D"
source = "Name ours. The property set (0x18 bytes: vtable, count at +4, a map of uint32 keys to value blocks at +8 with its size at +0xC, the cursor at +0x14). No arguments, plain ret; returns the object. Called by the window constructors 0x0093EAA1 and 0x0093FE12 and the two subclasses 0x00939750 and 0x009396D8. Ours in framework.propset.set (docs/gzui.md)."

