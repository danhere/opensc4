# The HTML viewer: its director, the HTML window, the document with its tokenizer and parser, the nodes' layout and paint, and the Internet service with its cookie store and file cache (docs/html.md). The parser (h3, with the tokenizer of h2) is ours, in the ui.html.parser.* groups, the layout (h4 and the layout side of h5) in ui.html.layout and the ui.html.nodes.layout.* groups, and the nodes' paint, hit tests and links (h5b) in the ui.html.nodes.paint.* groups, ui.html.nodes.hit and ui.html.nodes.links, and the nodes' constructors and destructors, colours and character helpers (h5c) in ui.html.nodes.ctors, ui.html.nodes.ctors.text, ui.html.nodes.dtors, ui.html.colors and ui.html.chars, with h5d's in ui.html.nodes.pictures and ui.html.nodes.children; the document's node constructors and destructors outside h5, attribute setters, small tag handlers and tokenizer helpers (h2a) and the document's slots, Init, base and destructors, the parser's glue in h2 and the font stack (h2b1) and the image fetching, image map, bullets and last slots (h2b2) in the ui.html.document.* groups; the HTML window's life, pages, COM slots and settings (h1a) in the ui.html.window.* groups; the rest is not hooked.

