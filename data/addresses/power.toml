[[entry]]
name = "cSC4PowerSimulator::Init"
address = 0x006F03B0
kind = "function"
convention = "thiscall"
expect = "A0 AC A5 B4 00 83 EC 24"
source = "Slot 3. References to the city (+0x18) and its services (+0x1C, +0x28 to +0x34), the department (+0x20); once (+0xC) the tuning, the simulator service registrations, the usage figures, ten messages and the consumption map sized to the city; once (+0xD) the bit arrays, the supply grid (+0x80, a cSC4SimGridUint8), the usage history cleared, state 4 and a new department. Reimplemented by simulators.power.init (docs/power.md)."

