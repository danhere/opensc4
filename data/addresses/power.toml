source = "Name ours. The network reached from a plant's cell (flood over the wired bits): the output of plants newly reached (+0x3C), the consumers of types 0x4773FFE0 and 0x4773FFE1 served from it, then 8x8 blocks powered while the supply lasts (+0x2D0, +0x4C, +0x6C), the remaining demand (+0x40, +0x44, +0x48), and UpdatePlantUsage. Reimplemented by simulators.power.helpers (docs/power.md)."

[[entry]]
name = "cSC4PowerSimulator::Simulate"
address = 0x006EE960
kind = "function"
convention = "thiscall"
expect = "83 EC 70 53 56 8B F1 8A"
source = "Name ours. The simulation step, one state per call (+0x34C, jump table 0x006EF79C) while the network is awake (+0x14): 0 starts the month over, 1 distributes power from each plant and books plant costs, 2 serves consumers still short and publishes changed cells, 3 publishes the month's figures and each lot's powered state, 4 waits for a change (+0x338). Reimplemented by simulators.power.step (docs/power.md)."

