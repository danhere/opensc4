# Format and rules: data/addresses/README.md.

[[entry]]
name = "cSC4PowerSimulator::vftable"
address = 0x00AB28B8
kind = "vtable"
expect = "C0 AB 6E 00 A0 7B 4F 00"
source = "Primary vtable: cISC4PowerSimulator, 52 slots (gzcom-dll's overloads in the other order: slot 16 is GetMonthlyConsumption(x, z), 17 the total; 23 by type, 24 the total). simulators.power.interface swaps its getters (docs/power.md)."

