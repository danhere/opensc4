source = "Name ours. Copy constructor of a texture record (0x7C bytes: a float, five curves copied through 0x005F4430, five dwords at +0x54 and five at +0x68), RET 4. Only 0x0074F180 and the map's insert call it. The game's; called at its address by our loader."

