# cSTETerrain (build 641), piece 8: the three startup table loaders 0x0074FE40 runs besides the brush loader
# (src/core/terrain_tables.cpp: the texture exemplars and the tuning exemplar; src/core/terrain_tables_ini.cpp: the
# INI resource) and what they write. New names only. Reused: cSTETerrain::ResourceManager, ::Random, ::StaticsDone,
# ::InverseCellWidth, ::CellWidthFloat and the tuning globals earlier pieces named (terrainsim.toml to
# terrainsim7.toml); the property getters, curve, vector, string and ini file functions of core.toml, crime.toml,
# traffic.toml, flora.toml, region.toml, ui.toml, scripts.toml, ordinance.toml and audio.toml.

[[entry]]
name = "cSTETerrain::LoadTextureExemplars"
address = 0x0074F410
kind = "function"
convention = "cdecl"
signature = "void ()"
expect = "51 A1 40 BC B4 00 85 C0"
source = "Name ours. The first of the four loaders of 0x0074FE40 (its only caller, 0x0074FE7A): nothing without the resource manager 0x00B4BC40; else zeroes 0x00B4BC44, lists the exemplars of type 0x6534284A, group 0x89C2A517 (a key filter 0x00682020, the resource manager's slot 17), has the list call 0x0074F180 for each (its slot 7) and adds 1 to 0x00B4BC44. Ours in simulators.terrain.tables_exemplars (src/core/terrain_tables.cpp)."

[[entry]]
name = "cSTETerrain::LoadTextureExemplar"
address = 0x0074F180
kind = "function"
convention = "cdecl"
signature = "void (const uint32_t* key, void* context)"
expect = "55 8B EC 83 E4 F8 81 EC"
source = "Name ours. The key list's callback of 0x0074F410 (its address occurs only there): keeps the greatest instance in 0x00B4BC44, finds or inserts the instance's record in the hash map 0x00B4BCDC (0x00748E90, 0x004F0940, 0x0074BFB0, 0x00748920, 0x007488F0), and reads the exemplar: property 0x09C2AEF0 (float) to the record's +0, and for i = 0 to 4 property 0x09C2AEF3 + i (float pairs) into the curve +4 + 0x10 i (0x005F4480), the last pair's x to +0x68 + 4 i and its ceiling in cells to +0x54 + 4 i and into the maxima 0x00B4BC48. Ours has its own copy."

[[entry]]
name = "cSTETerrain::TextureRecordCopy"
address = 0x00748E90
kind = "function"
