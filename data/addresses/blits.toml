[[entry]]
name = "GZBlit::ColourFromFloats"
address = 0x008DA4A0
kind = "function"
convention = "cdecl"
signature = "uint32_t (float red, float green, float blue, float alpha)"
expect = "D9 44 24 04 D8 1D 54 10"
source = "Name ours (docs/pixels.md, \"Blits\"). Each float clamped to 0..1 and made a byte by adding 49152.0f (the float's low 8 bits then hold v * 256, rounded) and folding 256 to 255; alpha << 24 | red << 16 | green << 8 | blue. Called by the Software driver (0x008DA9E0, 0x008DB780, 0x008DB7C0). Ours in renderer.blits.math."

