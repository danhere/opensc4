# The GZ framework's 2D blits and their neighbours, 0x008D8760 to 0x008DA8BF (docs/pixels.md, "Blits"). TileBlit 0x008D8BC0 is in region.toml (GZBuffer::TileBlit). Ours in src/core/gzbuffer_blit.cpp, groups renderer.blits.*.

[[entry]]
name = "GZBlit::Shade"
address = 0x008D8760
kind = "function"
convention = "cdecl"
signature = "uint32_t (uint8_t red, uint8_t green, uint8_t blue, int32_t delta)"
expect = "0F B6 44 24 04 56 8B 74"
source = "Name ours (docs/pixels.md, \"Blits\"). 0xFF000000 | red << 16 | green << 8 | blue, each byte plus delta clamped to 0..255 by the sum's sign. Called by 0x008D9870 for its bevel. Ours in renderer.blits.math."

[[entry]]
name = "GZBlit::DrawFrame"
address = 0x008D8800
kind = "function"
convention = "cdecl"
signature = "void (void* context, cIGZUnknown* picture, const cRZRect* cell, const cRZRect* target, bool centre)"
expect = "83 EC 2C 8B 44 24 38 8B"
source = "Name ours (docs/pixels.md, \"Blits\"). A frame of nine cells of the picture (the cell and the cells right of and below it) laid over the target through a drawing context: slot 10, the colour (the picture's 0x86D72B57 slot 4, or -1) to slot 21, corners by slot 38, edges and the centre (when set) tiled by slot 39, slot 11. Called by six framework widgets (0x0099xxxx to 0x009Cxxxx). Ours in renderer.blits.tile."

