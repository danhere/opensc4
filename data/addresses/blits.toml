address = 0x008D9020
kind = "function"
convention = "cdecl"
signature = "bool (cIGZBuffer* target, cIGZBuffer* source, const cRZRect* sourceArea, const cRZRect* targetArea, const cRZRect* clip)"
expect = "83 EC 58 55 8B 6C 24 60"
source = "Name ours (docs/pixels.md, \"Blits\"). The source area stretched over the target area: through the drawing context of the target's 0xAB300B2B when it has one, else pixel by pixel in 16.16 steps (GetPixel, the RGBA conversions, SetPixel) over the target area cut to the target's area and the clip. False for an empty area or a source area outside the source. Called by 0x007C0220 and 0x00908FD5. Ours in renderer.blits.tile."

