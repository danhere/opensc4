# Resource setup at startup: what resources.plugin_loader (src/core/plugin_loader.cpp)
# calls or reads in place of cSC4App::SetupResources (core.toml; docs/resources.md).

[[entry]]
name = "cSC4App::SetupResources_DebugCallback"
address = 0x00456BA0
kind = "function"
convention = "custom"
signature = "unknown"
expect = "81 EC 14 01 00 00"
source = "Name ours. Passed by SetupResources, with the global at 0x00B07F00 and the app, to slot 7 of service 0x25076B9E (interface 0xA237613C) when the app's GetDebugFunctionalityEnabled is true (0x004572C7-0x00457315). Never called by OpenSC4, only passed on."

[[entry]]
name = "cSC4App::SetupResources_DebugName"
address = 0x00B07F00
kind = "data"
source = "Name ours. A pointer (0x00A806E8 in the file) SetupResources passes on with the debug callback above (0x00457300)."

[[entry]]
name = "cGZDBSegmentPackedFile::kSignature"
address = 0x00B6363C
kind = "data"
source = "Name ours. The 4-byte package signature the plugin scan compares a file's first bytes with (0x009728D5, which SetupResources calls for every plugin file that is not a .dat). Uninitialised data in the file, set at startup."

[[entry]]
name = "cGZDBSegmentPackedFile::OpenRecordUnlocked"
address = 0x009701FD
kind = "function"
convention = "thiscall"
signature = "bool (cIGZPersistDBSegment* this, const cGZPersistResourceKey* key, cIGZPersistDBRecord** record, uint32_t flags)"
expect = "55 8B EC 83 EC 14 56 57"
source = "Name ours. The packed-file segment's (0x086D4A89) open, slot +0x88 of its interface vtable (0x00AD87B0, 0x00AA2578); the public OpenRecord 0x009757A0 calls it under the segment's lock. this is the object + 4. A read-open of a key already in the open map (+0xD4) builds a record on the open one's data; the type-2 path (0x0096D9D1) is the crash at 0x0096DA20 (docs/crashes.md). RET 0xC."

[[entry]]
name = "cGZDBSegmentPackedFile::RecordMapFind"
address = 0x0097989F
kind = "function"
convention = "thiscall"
signature = "void* (void* map, const cGZPersistResourceKey* key)"
expect = "53 56 57 8B 39 8B 77 04"
source = "Name ours. Lower bound of the segment's open-record multimap {header*, count} (segment interface + 0xD4): the first node with the key, or the header when there is none. Node: +0x10 key, +0x1C record. Called from 0x00970247. RET 4."

[[entry]]
name = "cGZDBSegmentPackedFile::RecordMapErase"
address = 0x00927CF8
kind = "function"
convention = "thiscall"
signature = "void (void* map, void* node)"
expect = "56 8B F1 8B 06 8D 48 0C"
source = "Name ours. Erases one node of the open-record multimap (node by value): unlinks and rebalances (0x0040DAF0), frees the node (0x0090CF63), decrements the count; the record is not touched. The segment's close does Release then this (0x00971A3A). RET 4."

[[entry]]
name = "cSC4COMSerializer::StreamOpen"
address = 0x005D2410
kind = "function"
convention = "thiscall"
signature = "bool (void* this, void* segment, const cGZPersistResourceKey* key, bool fromStart)"
expect = "57 8B F9 8B 07 FF 50 58 84 C0 75 04 5F C2 0C 00"
source = "Name ours. The save's record stream open (docs/crashes.md, Prop pox): opens the record for write, existing before new; after success the record is at this+8. fromStart true seeks to 0, false to the record's size (append). RET 0xC. Hooked read-only by diagnostics.prop_pox."

[[entry]]
name = "cGZDBSegmentPackedFile::WriteRecordSetFieldVoid"
address = 0x00970F0F
kind = "function"
convention = "thiscall"
signature = "bool (void* this, const void* data, uint32_t len)"
expect = "55 8B EC 83 EC 1C 53 56 33 DB 8B F1 66 39 5E 0A"
source = "Name ours. Write of a packed-file write record (vtable 0x00AD8628): flags word +0x0A, key +0x0C, buffer +0x44/+0x48, position +0x50, temp file +0x54, spilled +0x58; moves the buffer to a temp file when the write reaches 2,000,000 bytes. RET 8. Hooked read-only by diagnostics.prop_pox."

[[entry]]
name = "cGZDBSegmentPackedFile::DeleteRecord"
address = 0x00971A55
kind = "function"
convention = "thiscall"
signature = "bool (cIGZPersistDBSegment* this, const cGZPersistResourceKey* key)"
expect = "55 8B EC 83 EC 14 53 56 8B F1 8B 46 18 A8 03 57"
source = "Name ours. Slot +0x98 of the packed-file segment's interface; does nothing unless the segment is open for write (flags +0x18 & 3 and & 2) and silently refuses while the key is in the open map (+0xD4). RET 4. Hooked read-only by diagnostics.prop_pox."

[[entry]]
name = "cSC4COMSerializer::LoadClassObjects"
address = 0x005D38D0
kind = "function"
convention = "thiscall"
signature = "bool (void* this)"
expect = "55 8B EC 6A FF 68 C0 EF A6 00 64 A1 00 00 00 00"
source = "Name ours. Reads the class objects of a save (docs/crashes.md, Prop pox); returns early unless the state at this+0x20 is 1. The class map is at this+0x14 ({header*, count}; node: class ID +0x10, expected count +0x14, registered count +0x18). Has an SEH frame. Hooked read-only by diagnostics.prop_pox."

