[[entry]]
name = "cSC4DemandSimulator::vftable"
address = 0x00AB0E48
kind = "vtable"
expect = "10 23 6A 00 A0 7B 4F 00"
source = "Primary vtable: cISC4DemandSimulator, 12 slots, the scalar deleting destructor in slot 12 and 13 (0x006A52D0, adds a demand object). Others: cIGZMessageTarget2 at +4 (0x00AB0E38), cIGZSerializable at +8 (0x00AB0E20). simulators.demand.interface swaps slots 5-11 (docs/demand.md)."

