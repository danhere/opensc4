[[entry]]
name = "cSC4ViewInputControlDemolish::Init"
address = 0x004B8AB0
kind = "function"
convention = "thiscall"
expect = "56 8B F1 8A 46 04 84 C0"
source = "Name ours. No arguments, slot 3: sets the ID, runs the base Init, makes the overlay helper (0x50 bytes) once and gives it to the service 0x00B43DD0 (slot 0x80, 5, 1000), takes the services (budget, city, demolition 0x00B43D00, lot developer, lot manager, a filter object, occupant manager), copies four colours from the renderer's settings into +0x98 to +0xD4. True."

[[entry]]
name = "cSC4ViewInputControlDemolish::UpdateHover"
address = 0x004B8D10
kind = "function"
convention = "thiscall"
expect = "83 EC 1C 56 8B F1 8B 46"
source = "Name ours. (x, z, int* rect), ret 0xC: lets go of the hovered occupant at +0x70, finds a new one (FindOccupant), takes its position or the ground's, the cell and the lot there; rect (x0, z0, x1, z1) is the lot's rectangle when it can be demolished and its building passes the view's filter, else the occupant's cells, else the cell. False without a view or ground."

