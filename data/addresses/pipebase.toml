[[entry]]
name = "SC4PipeBase::DeletingDestructor"
address = 0x0065C650
kind = "function"
convention = "thiscall"
expect = "56 8B F1 E8 68 FA FF FF"
source = "Name ours. Ret 4 (flags): the intermediate class destructor 0x0065C0C0, and with flag 1 for a non-null object the item back to the pool 0x00B0D008 (page at address & 0xFFFF0000; released at count 0, reopened at 0x4000004D). Only the thunks 0x0065C1C0 and 0x0065C1E3 of the class own vtables reach it, so the game never runs it (src/core/pipebase_2.cpp)."

