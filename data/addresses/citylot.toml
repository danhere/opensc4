# The lot (cSC4Lot, class ID 0xC9BD5D4A) and its business unit (cSC4BusinessUnit, 0x4A232DA8); docs/citylot.md: code 0x006BF180 to 0x006C3AF8 (src/core/citylot_object.cpp, citylot_capacity.cpp, citylot_state.cpp). Fn_<address> names are placeholders; each source file names the function in its comments.

[[entry]]
name = "cSC4Lot::vftable"
address = 0x00AB19B0
kind = "vtable"
expect = "90 F1 6B 00 A0 64 46 00"
source = "The primary cISC4Lot vtable (70 slots, listed in src/core/citylot_sim.h). The object part swaps slots 5, 7, 8 (simulators.citylot.init) and 11, 13-15, 17, 20-22, 27, 32, 40, 42, 46, 48-53, 56, 57, 60, 63, 64 (simulators.citylot.slots); simulators.citylot.object copies it at the first construction."

